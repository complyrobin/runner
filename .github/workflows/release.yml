name: Release

# To release: open Actions, pick "Release" and press "Run workflow" on main. It tags main with the runner's own version
# (Runner::VERSION, e.g. v0.1.0) and releases that. Pushing such a tag by hand does the same. This publishes the GitHub release, moves the major tag (v0) that customers'
# workflows use, and publishes the container image to ghcr.io/complyrobin/runner. Packagist picks the tag up by itself
# once the repository is submitted there.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag is the runner's version
        id: version
        run: |
          version="$(php bin/complyrobin-runner --version | awk '{print $2}')"
          tag="v${version}"

          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            test "${GITHUB_REF}" = "refs/heads/main" || { echo "Run this on main, not ${GITHUB_REF_NAME}"; exit 1; }
            git ls-remote --exit-code --tags origin "refs/tags/${tag}" > /dev/null && { echo "${tag} is released already. Raise Runner::VERSION first."; exit 1; }
            git tag "${tag}" "${GITHUB_SHA}"
            git push origin "refs/tags/${tag}"
          else
            test "${tag}" = "${GITHUB_REF_NAME}" || { echo "Runner::VERSION is ${version}, the tag is ${GITHUB_REF_NAME}"; exit 1; }
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "major=${tag%%.*}" >> "$GITHUB_OUTPUT"

      - name: Move the major tag
        run: |
          git tag -f "${{ steps.version.outputs.major }}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${{ steps.version.outputs.major }}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ steps.version.outputs.tag }}" --generate-notes --verify-tag

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: tags
        run: |
          echo "list=ghcr.io/complyrobin/runner:${{ steps.version.outputs.tag }},ghcr.io/complyrobin/runner:${{ steps.version.outputs.major }},ghcr.io/complyrobin/runner:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
