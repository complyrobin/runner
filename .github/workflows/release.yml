name: Release

# Push a tag such as v0.1.0 to release. This publishes the GitHub release, moves the major tag (v0) that customers'
# workflows use, and publishes the container image to ghcr.io/complyrobin/runner. Packagist picks the tag up by itself
# once the repository is submitted there.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: The tag matches the runner's version
        run: |
          version="$(php bin/complyrobin-runner --version | awk '{print $2}')"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Runner::VERSION is ${version}, the tag is ${GITHUB_REF_NAME}"; exit 1; }

      - name: Move the major tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "${major}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${major}"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes --verify-tag

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Image tags
        id: tags
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          echo "list=ghcr.io/complyrobin/runner:${GITHUB_REF_NAME},ghcr.io/complyrobin/runner:${major},ghcr.io/complyrobin/runner:latest" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.list }}
