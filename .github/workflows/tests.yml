name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4", "8.5"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, sodium
          coverage: none
      - run: composer install --no-interaction --no-progress
      - run: vendor/bin/phpunit

  # The action uses the PHP that GitHub's Ubuntu machines already have, with no Composer install.
  preinstalled-php:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: php -v && php -m | grep -E '^(curl|sodium)$'
      - run: php bin/complyrobin-runner --version
      - name: The action refuses to start without its settings
        uses: ./
        id: no-settings
        continue-on-error: true
        with:
          organisation: ""
          runner-token: ""
      - run: test "${{ steps.no-settings.outcome }}" = "failure"
